    <td width="74%" height="100"><font size="+1">正推法的步驟大致如下：</font><br>
      (1) 根據跡証，決定碰撞點、碰撞方向、碰撞位置、煞車距離。<br>
      (2) 從碰撞車的車面決定碰撞面方向、碰撞中心之位置，由此可決定質心至碰撞中心。<br>
      (3) 輸入兩車的質量、尺寸及有關數據。<br>
      (4) 決定可能知道的速度量及汽車速度方向，例如碰撞前車的角速度常為零。<br>
      (5) 決定恢復係數e及衝量比 。<br>
      (6) 利用已知的數據作碰撞分析。<br>
      (7) 改變初始速度直到碰撞後的資訊與實際接近相等。<br></td>
    <td width="26%"><div align="center"><a href="../ex/04C1.xls"><img src="../B/20.png" width="150" height="40" border="0"></a></div></td>
  </tr>
