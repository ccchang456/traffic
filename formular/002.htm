  一維碰撞是指碰撞是發生在車身的前後方向（縱軸），並且運動與變形也是沿著縱軸方向。因此只要用一個座標軸就可完整描述兩車的運動狀態，例如完全正面碰撞、追尾碰撞便是一維碰撞。一維碰撞的計算有應用恢復係數的動量法及利用碰撞塑性變形的能量法兩種方法。</font></div>
